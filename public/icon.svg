<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Кубомет</title>
  <!-- Иконка для тулбара Miro: месяц в шестиграннике d20. Только currentColor,
       без заливок фона — Miro перекрашивает иконку под тему доски.
       Шестигранник обводкой, месяц заливкой: на 24px сплошная фигура читается
       заметно лучше тонкого контура. -->
  <path d="M12 2 21 7v10l-9 5-9-5V7z" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linejoin="round" />
  <path d="M17.4 12.47a5.4 5.4 0 1 1-5.87-5.87 4.2 4.2 0 0 0 5.87 5.87z" fill="currentColor" />
</svg>
