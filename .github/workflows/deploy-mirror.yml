name: Зеркало на GitHub Pages

# Зеркало — страховка: если основной домен окажется недоступен у части игроков,
# на него можно переключиться вторым приложением в Miro.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Красные тесты не должны доезжать до игроков: зеркало и проверки —
      # разные воркфлоу, и без этой строки сборка уходила независимо от них.
      - run: npm test
      - run: npm run build
      # enablement включает Pages сам, чтобы не ходить в настройки репозитория руками.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
