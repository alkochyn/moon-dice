# Пример конфига для панели кубомета.
#
# Требования Miro: только HTTPS и возможность встраивания в iframe miro.com.
# Заголовок X-Frame-Options здесь НЕ ставим — он запретит встраивание;
# ограничение задаём через frame-ancestors.

server {
    listen 80;
    server_name dice.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dice.example.ru;

    ssl_certificate     /etc/letsencrypt/live/dice.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dice.example.ru/privkey.pem;

    root /var/www/moon-dice;
    index index.html;

    # Панель встраивается только доской Miro.
    add_header Content-Security-Policy "frame-ancestors https://miro.com https://*.miro.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Панель — один файл, он должен обновляться сразу, а не жить в кэше неделю.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors https://miro.com https://*.miro.com" always;
    }

    # Service worker обязан перепроверяться, иначе новая сборка не доедет.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
